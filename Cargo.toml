[workspace]
members = ["crates/*", "xtask"]
exclude = [".run"]
default-members = ["crates/backend"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/chrislearn/hagency-server"
publish = false

[workspace.dependencies]
# Git branches select upstream sources; Cargo.lock pins exact embedded revisions.
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.23"
camino = "1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", features = ["postgres", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres"] }
dioxus = "=0.7.5"
dioxus-logger = "0.7.4"
figment = "0.10"
flate2 = "1"
futures = "0.3.31"
gloo-net = "0.7"
gloo-storage = "0.4.0"
gloo-timers = "0.4"
hex = "0.4"
js-sys = "0.3.95"
libc = "0.2"
log = "0.4.29"
opentelemetry = { version = "0.32", features = ["trace"] }
palpo = { git = "https://github.com/palpo-im/palpo.git", branch = "main" }
palpo-core = { git = "https://github.com/palpo-im/palpo.git", branch = "main", features = ["markdown", "html"] }
pasion-backend = { git = "https://github.com/meldry-com/pasion.git", branch = "main", features = ["cedar"] }
pasion-config = { git = "https://github.com/meldry-com/pasion.git", branch = "main" }
pasion-data = { git = "https://github.com/meldry-com/pasion.git", branch = "main" }
percent-encoding = "2.3"
rand = "0.10"
rand_chacha = "0.3"
rand_core = "0.6"
regex = "1"
regex-lite = "0.1.9"
reqwest = { version = "0.13", features = ["json"] }
ruma-identifiers-validation = "0.12.1"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
ryu-js = "1.0.3"
salvo = { version = "1.0.0", features = ["serve-static", "test", "affix-state", "size-limiter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.27"
serde_json = "1.0.149"
sha2 = "0.11"
signal-hook = "0.3"
subtle = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.52", features = ["full"] }
toml = { version = "1.1", features = ["serde"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
urlencoding = "2.1.3"
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
web-sys = "0.3.95"
zeroize = "1"

[profile.release.package.palpo]
opt-level = 1
codegen-units = 256

# Local stop-gap for Palpo's 3 s /sync wake-up (see .run/palpo-8c1759f/crates/server/src/watcher.rs).
# Remove when upstream Palpo wakes waiting syncs on new events.
# TODO(deferred, upstream blocker): .run/ is gitignored, so a clean checkout/CI cannot
# build with this patch. Replace with the csheargm/palpo topic/sync-wakeup branch (git
# dependency) or drop it once that lands upstream. Kept: the live demo needs it.
[patch."https://github.com/palpo-im/palpo.git"]
palpo = { path = ".run/palpo-8c1759f/crates/server" }
palpo-core = { path = ".run/palpo-8c1759f/crates/core" }
palpo-core-macros = { path = ".run/palpo-8c1759f/crates/core-macros" }
palpo-data = { path = ".run/palpo-8c1759f/crates/data" }
palpo-identifiers-validation = { path = ".run/palpo-8c1759f/crates/identifiers-validation" }
palpo-server-macros = { path = ".run/palpo-8c1759f/crates/server-macros" }

# Demo build: Pasion feat/native-auth-api (native JSON auth API, lowercased
# usernames, consent hoop; built at pasion commit f17b381) instead of pasion main. .run/pasion-native-auth
# is a local symlink to the Pasion worktree (gitignored, like palpo above).
# TODO(deferred): replace with a git dependency on the pushed branch, or drop
# once feat/native-auth-api lands on pasion main. Path deps are not pinned by Cargo.lock
# and the Linux Dockerfile does not copy .run/pasion-native-auth: demo Mac build only.
[patch."https://github.com/meldry-com/pasion.git"]
pasion-backend = { path = ".run/pasion-native-auth/crates/backend" }
pasion-config = { path = ".run/pasion-native-auth/crates/config" }
pasion-data = { path = ".run/pasion-native-auth/crates/data" }
pasion-i18n = { path = ".run/pasion-native-auth/crates/i18n" }
pasion-iana = { path = ".run/pasion-native-auth/crates/iana" }
pasion-jose = { path = ".run/pasion-native-auth/crates/jose" }
pasion-keystore = { path = ".run/pasion-native-auth/crates/keystore" }
pasion-matrix = { path = ".run/pasion-native-auth/crates/matrix" }
pasion-matrix-palpo = { path = ".run/pasion-native-auth/crates/matrix-palpo" }
pasion-messaging = { path = ".run/pasion-native-auth/crates/messaging" }
pasion-policy = { path = ".run/pasion-native-auth/crates/policy" }
pasion-tasks = { path = ".run/pasion-native-auth/crates/tasks" }
pasion-templates = { path = ".run/pasion-native-auth/crates/templates" }
oauth2-types = { path = ".run/pasion-native-auth/crates/oauth2-types" }
