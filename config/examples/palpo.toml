# Native Palpo ServerConfig: no [matrix] wrapper.
server_name = "localhost:8088"
allow_registration = false
# Embedded mode uses Hagency's listener instead of Palpo's listeners.
[db]
url = "postgres://hagency:hagency_dev@127.0.0.1:55438/palpo"
pool_size = 10
[well_known]
client = "http://127.0.0.1:8088"
server = "localhost:8088"
[storage]
backend = "fs"
root = "../../data/media"

# Public webpage cards in Desktop. The outbound URL guard still blocks private
# network addresses and unsafe schemes, and the preview client rejects redirects.
[url_preview]
domain_explicit_allowlist = ["*"]
max_spider_size = 256000
max_image_size = 10000000
