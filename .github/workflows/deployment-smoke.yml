name: Embedded Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backup_restore:
        description: Run the stopped three-database and private filesystem restore drill
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deployment:
    name: Embedded deployment smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the reviewed image locally without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: hagency-server:deployment-smoke
          build-args: HAGENCY_SOURCE_FINGERPRINT=${{ github.sha }}
          cache-from: |
            type=gha,scope=server-smoke-amd64
            type=gha,scope=server-amd64
          cache-to: type=gha,scope=server-smoke-amd64,mode=max
          provenance: false
      - name: Real Pasion PKCE, Matrix AS delivery, SIGTERM drain and restart
        env:
          HAGENCY_TEST_IMAGE: hagency-server:deployment-smoke
          HAGENCY_TEST_IMAGE_SOURCE: ${{ github.sha }}
        run: node tests/docker-smoke.mjs

      # Every PR also validates the longer stopped backup/restore drill against
      # this exact image. Main pushes run smoke; weekly/manual runs add the drill.
      # It uses the same freshly built executable/assets, three new databases and
      # private directories; no production service or external model is contacted.
      - uses: actions/setup-python@v7
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.backup_restore == true
        with:
          python-version: '3.13'
      - name: Extract image resources and create an independent restore fixture
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.backup_restore == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq5
          umask 077
          fixture_root="$RUNNER_TEMP/hagency-backup"
          mkdir -p "$fixture_root" config/dev
          export_container="hagency-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backup_database="hagency-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "BACKUP_EXPORT_CONTAINER=$export_container" >> "$GITHUB_ENV"
          echo "BACKUP_DATABASE_CONTAINER=$backup_database" >> "$GITHUB_ENV"
          docker create --name "$export_container" hagency-server:deployment-smoke >/dev/null
          docker cp "$export_container:/usr/local/bin/hagency-server" "$fixture_root/hagency-server"
          docker cp "$export_container:/app/resources/pasion" "$fixture_root/pasion"
          docker cp "$export_container:/app/resources/frontend/public" "$fixture_root/frontend"
          docker rm "$export_container" >/dev/null
          cp config/examples/palpo.toml config/dev/palpo.toml
          cp config/examples/pasion.toml config/dev/pasion.toml
          export POSTGRES_PASSWORD
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          docker run -d --name "$backup_database" \
            -e POSTGRES_USER=hagency_backup -e POSTGRES_DB=postgres -e POSTGRES_PASSWORD \
            -p 127.0.0.1::5432 postgres:18.6-alpine >/dev/null
          for _attempt in $(seq 1 60); do
            if docker exec "$backup_database" pg_isready -U hagency_backup -d postgres >/dev/null; then break; fi
            sleep 1
          done
          docker exec "$backup_database" pg_isready -U hagency_backup -d postgres
          database_port=$(docker port "$backup_database" 5432/tcp | sed 's/.*://')
          {
            echo "HAGENCY_TEST_POSTGRES_CONTAINER=$backup_database"
            echo "HAGENCY_TEST_POSTGRES_PORT=$database_port"
            echo "HAGENCY_TEST_SERVER_BINARY=$fixture_root/hagency-server"
            echo "HAGENCY_TEST_PASION_RESOURCES=$fixture_root/pasion"
            echo "HAGENCY_TEST_FRONTEND_RESOURCES=$fixture_root/frontend"
          } >> "$GITHUB_ENV"
      - name: Restore all three databases, private identities and actual Matrix media
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.backup_restore == true
        timeout-minutes: 20
        env:
          HAGENCY_TEST_BACKUP_RESTORE: '1'
        run: python3 scripts/test-agent-integration.py
      - name: Remove only this job's restore containers
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.backup_restore == true)
        shell: bash
        run: |
          if [ -n "${BACKUP_EXPORT_CONTAINER:-}" ]; then docker rm -f "$BACKUP_EXPORT_CONTAINER" >/dev/null 2>&1 || true; fi
          if [ -n "${BACKUP_DATABASE_CONTAINER:-}" ]; then docker rm -f "$BACKUP_DATABASE_CONTAINER" >/dev/null 2>&1 || true; fi
