name: Embedded Deployment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backup_restore:
        description: Run the stopped three-database and private filesystem restore drill
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-scope.yml

  deployment:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.smoke != 'false') }}
    name: Embedded deployment smoke
    runs-on: ubuntu-24.04
    # Cold image builds can take ~88 minutes before smoke and restore checks.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reclaim unused SDK space on disposable hosted Linux runners
        shell: bash
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            df -h "$GITHUB_WORKSPACE"
            sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android
            df -h "$GITHUB_WORKSPACE"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build the reviewed image locally without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: hagency-server:deployment-smoke
          build-args: HAGENCY_SOURCE_FINGERPRINT=${{ github.sha }}
          cache-from: |
            type=gha,scope=server-smoke-amd64
            type=gha,scope=server-amd64
          cache-to: type=gha,scope=server-smoke-amd64,mode=max
          provenance: false
      - name: Real Pasion PKCE, Matrix AS delivery, SIGTERM drain and restart
        env:
          HAGENCY_TEST_IMAGE: hagency-server:deployment-smoke
          HAGENCY_TEST_IMAGE_SOURCE: ${{ github.sha }}
        run: node tests/docker-smoke.mjs

      - name: Exercise backup and restore
        if: github.event_name == 'schedule' || inputs.backup_restore || (github.event_name == 'pull_request' && needs.changes.outputs.restore != 'false')
        uses: ./.github/actions/restore-drill
        with:
          image: hagency-server:deployment-smoke
