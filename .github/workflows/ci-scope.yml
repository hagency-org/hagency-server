name: CI change scope

on:
  workflow_call:
    inputs:
      check_spelling:
        type: boolean
        default: false
    outputs:
      docs_only:
        value: ${{ jobs.scope.outputs.docs_only }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Identify documentation-only PRs
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          # Compare the tested merge with its base parent, including deletions and renames.
          if git diff --quiet --no-renames HEAD^1 HEAD -- . \
              ':(exclude)README.md' ':(exclude)README.zh-CN.md' \
              ':(exclude,glob)docs/**/*.md' ':(exclude,glob)dev-vibe/**/*.md'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: crate-ci/typos@v1.51.1
        if: inputs.check_spelling
