name: hagency-server
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: hagency
      POSTGRES_DB: hagency
      POSTGRES_PASSWORD: ${HAGENCY_DB_PASSWORD:-hagency_dev}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - database:/var/lib/postgresql
      - ./deploy/databases.sql:/docker-entrypoint-initdb.d/20-components.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U hagency -d hagency"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  server:
    build: .
    # Health requires both the startup AS roundtrip and live worker progress.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./config/docker:/app/config:ro
      - server-data:/app/data
    stop_grace_period: 75s
    restart: unless-stopped
volumes:
  database:
  server-data:
